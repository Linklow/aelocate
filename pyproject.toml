[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aelocate"
version = "0.1.0"
description = "Acoustic emission (AE) acquisition simulator, hit detection and source location workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Mishchenko" }]
keywords = ["acoustic emission", "NDT", "NDE", "structural health monitoring", "Lamb waves", "source location", "signal processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
plots = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
all = ["aelocate[ml,plots,gui]"]
dev = ["aelocate[all]", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
aelocate = "aelocate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aelocate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains a neural network (~10 s)"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]
